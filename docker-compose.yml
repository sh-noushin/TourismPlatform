name: tourism-platform

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      # Exposed so you can still point SSMS / sqlcmd at the containerised database.
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # The API waits on this; without it the first migration races SQL Server's startup.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./server
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Server=mssql,1433;Database=TourismPlatform;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      # No `dotnet ef` step exists in the container, and the seeders need the schema.
      Database__AutoMigrate: "true"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Jwt__Issuer: TourismPlatform
      Jwt__Audience: TourismPlatform
      SuperUser__Email: ${SUPERUSER_EMAIL:-superadmin@gmail.com}
      SuperUser__Password: ${SUPERUSER_PASSWORD:-SuperAdmin!123}
      SuperUser__Username: ${SUPERUSER_USERNAME:-superadmin}
    ports:
      # Host port matches the existing local default, so nothing else needs reconfiguring.
      - "5266:8080"
    volumes:
      - api-images:/app/images
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./client/dashboard
    environment:
      # Resolved by the browser, so it must be a host URL -- not http://api:8080.
      DASHBOARD_API_BASE_URL: ${DASHBOARD_API_BASE_URL:-http://localhost:5266}
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ./client/tourism-public-web
    environment:
      # Server-side rendering and the /api/proxy route call the API over the compose
      # network; browser-bound image URLs go through that proxy, so same-origin.
      API_BASE_URL: http://api:8080
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3001}
    ports:
      # Host port is overridable: 3000 is commonly taken by other local tooling.
      - "${PUBLIC_WEB_PORT:-3001}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mssql-data:
  api-images:
