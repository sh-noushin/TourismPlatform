<!doctype html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Geist carries the UI and tables (its numerals sit well in narrow columns),
       Space Grotesk the identity surfaces, Vazirmatn all Farsi text. Matches the
       approved reference, which embeds the same three families. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

  <meta charset="utf-8">
  <title>Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Sets window.__DASHBOARD_API_BASE_URL, read by app.config.ts. Generated at
       container start; absent when serving via `ng serve`, where the default applies. -->
  <script src="runtime-config.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
