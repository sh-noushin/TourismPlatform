server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Regenerated on every container start, so it must never be cached.
    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
    }

    # index.html is the only entry point; caching it would pin users to a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Translation files keep stable names, so nothing invalidates a cached copy
    # and newly added keys render as raw IDs (BRAND.SUBTITLE) until the user
    # clears their cache by hand. Revalidate on every load instead.
    location ~* ^/assets/i18n/.+\.json$ {
        add_header Cache-Control "no-cache" always;
    }

    # Angular emits content-hashed filenames under production `outputHashing: all`.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths are Angular routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
